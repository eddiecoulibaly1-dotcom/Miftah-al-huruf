nt-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold);font-weight:800}.muted{color:var(--muted);font-size:13px}.small{font-size:13px}.source-banner{margin-top:14px;border-left:5px solid var(--gold)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:9px 13px;cursor:pointer;text-decoration:none}.btn:hover{filter:brightness(.98)}.btn.primary{background:var(--ink);color:white;border-color:var(--ink)}.btn.gold{background:var(--gold);color:white;border-color:var(--gold)}.btn.danger{color:white;background:var(--danger);border-color:var(--danger)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;justify-content:center;background:rgba(255,253,248,.97);border-top:1px solid var(--line);box-shadow:0 -8px 28px rgba(0,0,0,.08);padding-bottom:max(4px,env(safe-area-inset-bottom))}.nav button{width:20%;max-width:180px;border:0;background:none;color:var(--muted);padding:9px 4px 7px;cursor:pointer;font-size:20px}.nav button small{display:block;font-size:10px;margin-top:2px}.nav button.active{color:var(--ink);font-weight:800}.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:14px}.section-head h1{font:700 29px Georgia,serif;margin:0}.section-head p{margin:5px 0 0;color:var(--muted)}.list-row{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:12px}.list-row h2{margin:5px 0}.ar{direction:rtl;font-family:Georgia,serif}.artext{direction:rtl;text-align:right;font:25px/2 Georgia,serif}.input{width:100%;border:1px solid var(--line);border-radius:13px;background:#fffdf8;color:var(--ink);padding:12px;outline:none}.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(179,138,67,.12)}.options{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.options label,.field{display:flex;flex-direction:column;gap:5px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--soft)}.field input{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--card);color:var(--ink)}.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.stat{background:#183f33;color:white;border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:3px}.stat small{color:#dce8e1}.stat b{font-size:27px;color:#e4c27d}.result-stack{display:grid;gap:12px;margin-top:14px}.verify{display:flex;justify-content:space-between;gap:10px;align-items:center}.verify.ok{border-left:5px solid #4c866a}.verify.bad{border-left:5px solid var(--danger)}.element{border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--card);display:flex;flex-direction:column;gap:4px}.element strong{font-size:25px}.element span{color:var(--muted);font-size:12px}.feu{border-left:5px solid #c85d3d}.terre{border-left:5px solid #817657}.air{border-left:5px solid #6591a2}.eau{border-left:5px solid #4f719d}.split{display:flex;justify-content:space-between;align-items:center;gap:10px}.badge,.chip{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 9px;font-size:12px}.chip{margin:3px;cursor:pointer;color:var(--ink)}.letter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:7px}.letter{border:1px solid var(--line);border-radius:11px;background:var(--card);padding:8px;text-align:center;display:flex;flex-direction:column;gap:2px}.letter span{font:27px Georgia,serif}.letter b{font-size:14px}.letter small{font-size:10px;color:var(--muted)}.warning{border:1px solid #d6b46d;background:#fff5d4;color:#5a4823;border-radius:12px;padding:11px;margin-top:10px}.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}.readerbar{position:sticky;top:61px;z-index:20;display:flex;align-items:center;gap:8px;flex- x}blockquote{margin:8px 0;padding:8px 12px;border-right:4px solid var(--gold);background:var(--soft);direction:rtl}.dark{}:root[data-theme="sombre"]{--bg:#0e1714;--card:#16231e;--ink:#edf4ef;--muted:#aab9b0;--gold:#d1a657;--line:#30443a;--soft:#21342c;--shadow:0 12px 35px rgba(0,0,0,.25)}:root[data-theme="sombre"] body{background:#0e1714}:root[data-theme="sombre"] .hero-card{background:#1b2a24}:root[data-theme="sombre"] .nav{background:rgba(22,35,30,.98)}:root[data-theme="sombre"] .readerbar{background:rgba(14,23,20,.97)}:root[data-theme="sombre"] .ocrtext{background:#18241f}:root[data-theme="sombre"] .warning{background:#3a321c;color:#f3df9e}
